name: Deploy Databricks Bundle

on:
   workflow_run:
      workflows: ["Validate Databricks Bundle"]
      types: [completed]
      branches: [DEV, UAT, main]

jobs:
  deploy:
    name: Deploy Bundle
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Map branch to target
        id: target
        run: |
          case "${{ github.ref_name }}" in
            DEV)  echo "target=dev"  >> $GITHUB_OUTPUT ;;
            UAT)  echo "target=uat"  >> $GITHUB_OUTPUT ;;
            main) echo "target=prod" >> $GITHUB_OUTPUT ;;
          esac

      - name: Configure Databricks auth
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ secrets.DATABRICKS_HOST }}
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: |
          cd DBA-pub-project_sdp
          databricks bundle validate -t ${{ steps.target.outputs.target }}

      - name: Deploy bundle
        run: |
          cd DBA-pub-project_sdp
          databricks bundle deploy -t ${{ steps.target.outputs.target }}
